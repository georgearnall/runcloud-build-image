name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, to pick up RunCloud base image and Node.js security updates.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  NODE_VERSION: '24'

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "short=$(echo '${{ matrix.php }}' | tr -d .)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # php8.5, php8.5-node24, and latest for the newest PHP.
          tags: |
            type=raw,value=php${{ matrix.php }}
            type=raw,value=php${{ matrix.php }}-node${{ env.NODE_VERSION }}
            type=raw,value=latest,enable=${{ matrix.php == '8.5' }}

      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            PHP_VERSION=${{ steps.version.outputs.short }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}
